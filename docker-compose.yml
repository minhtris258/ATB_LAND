services:
  mongo:
    image: mongo:8
    container_name: atb-land-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    volumes:
      - "D:/project/ATB LAND/mongo-data:/data/db"
    networks:
      - atb-network

  backend:
    build:
      context: "./backend"
      dockerfile: Dockerfile
    container_name: atb-land-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: "mongodb+srv://htvieclammienbac_db_user:bNOiymOcHBNVHHCk@cluster0.cehsxnc.mongodb.net/atb_land?retryWrites=true&w=majority&appName=Cluster0"
      JWT_SECRET: "AtbLandSuperSecretKey2026"
    depends_on:
      - mongo
    networks:
      - atb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: "./frontend"
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000/api"
    container_name: atb-land-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - atb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  atb-network:
    driver: bridge
